concurrency:
  group: infrastucture-repo-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  workflow_call:
    secrets: {}
    inputs:
      additional-globs-terraform:
        type: string
        default: ""
        description: A comma separated list of Globs which triggers terraform ci
      terraform-suggest-formatting-fixes:
        type: boolean
        default: true
        description: Create Github Pull Request review suggestions with fixes for formatting.
      terraform-cleanup-diskspace:
        type: boolean
        default: false
        description: Cleanup diskspace before init. This is useful for very large projects, but add 1 minute extra job time.
      opentofu-version:
        type: string
        default: ""
        description: If set, install this version of OpenTofu and set USE_TOFU=true so mage uses the tofu devtool instead of terraform.

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.terraform.outputs.terraform == 'true' && github.event_name == 'pull_request' }}
      policy-bot: ${{ steps.policy-bot.outputs.policy_bot == 'true' && github.event_name == 'pull_request' }}
      pallets: ${{ steps.pallets.outputs.pallets == 'true' && github.event_name == 'pull_request' }}
      catalog-info: ${{ steps.catalog-info.outputs.catalog_info == 'true' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore Pre-compiled coop-mage
        id: mage-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mage-bin/coop-mage
          key: coop-mage-bin-${{ runner.os }}-${{ runner.arch }}-1.27.1-${{ hashFiles('magefiles/**', 'magefile.go', 'go.mod', 'go.sum') }}
      - name: Set up Go
        if: steps.mage-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache: false
      - name: Compile coop-mage
        if: steps.mage-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .mage-bin
          go tool mage -compile "$PWD/.mage-bin/coop-mage"
      - name: Add coop-mage to PATH
        run: |
          chmod +x .mage-bin/coop-mage 2>/dev/null || true
          echo "$PWD/.mage-bin" >> "$GITHUB_PATH"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: csv
          filters: |
            changed:
              - '**'
      - name: List changes
        id: list
        run: coop-mage git:listChanges
      - name: Check for Terraform changes
        id: terraform
        run: echo "terraform=$(coop-mage terraform:changes)" >> $GITHUB_OUTPUT
        env:
          ADDITIONAL_GLOBS_TERRAFORM: ${{ inputs.additional-globs-terraform }}
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
      - name: Check for PolicyBot changes
        id: policy-bot
        run: echo "policy_bot=$(coop-mage policyBotConfig:changes)" >> $GITHUB_OUTPUT
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
      - name: Check for Pallet changes
        id: pallets
        run: echo "pallets=$(coop-mage pallets:changes)" >> $GITHUB_OUTPUT
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
      - name: Check for Catalog-info changes
        id: catalog-info
        run: echo "catalog_info=$(coop-mage catalogInfo:changes)" >> $GITHUB_OUTPUT
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}

  terraform:
    name: Terraform
    needs: ["detect-changes"]
    if: ${{  needs.detect-changes.outputs.terraform == 'true'  }}
    uses: ./.github/workflows/reusable-terraform.yaml
    with:
      suggest-formatting-fixes: ${{ inputs.terraform-suggest-formatting-fixes }}
      cleanup-diskspace: ${{ inputs.terraform-cleanup-diskspace }}
      opentofu-version: ${{ inputs.opentofu-version }}
      additional-globs-terraform: ${{ inputs.additional-globs-terraform }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      packages: read
      checks: read
    secrets: inherit

  policy-bot:
    name: Policy-bot
    needs: ["detect-changes"]
    if: ${{  needs.detect-changes.outputs.policy-bot == 'true'  }}
    uses: ./.github/workflows/reusable-policy-bot.yaml

  pallets:
    name: Pallets
    needs: ["detect-changes"]
    if: ${{  needs.detect-changes.outputs.pallets == 'true'  }}
    uses: ./.github/workflows/reusable-pallets.yaml

  catalog-info:
    name: Catalog Info
    needs: ["detect-changes"]
    if: ${{  needs.detect-changes.outputs.catalog-info == 'true'  }}
    uses: ./.github/workflows/reusable-catalog-info.yaml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
