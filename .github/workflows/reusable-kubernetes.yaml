concurrency:
  group: reusable-kubernetes-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs: {}
    secrets: {}

jobs:
  validate-kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the main branch as well
        run: git fetch origin main:main

      - name: Setup coop-mage
        uses: coopnorge/github-action-setup-mage@v0.0.4

      - name: Kubernetes List Detected charts
        id: list
        run: coop-mage k8s:list

      - name: Kubernetes validation
        id: validate
        run: coop-mage k8s:validate

      - name: Kubernetes diff
        id: diff
        run: coop-mage k8s:diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
