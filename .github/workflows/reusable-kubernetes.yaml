concurrency:
  group: reusable-kubernetes-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs: {}
    secrets: {}

jobs:
  validate-kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Tag reusable workflow metadata
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.eu
        run: |
          npx @datadog/datadog-ci tag --level job \
            --tags "reusable_workflow.ref:${{ job.workflow_ref }}" \
            --tags "reusable_workflow.repo:${{ job.workflow_repository }}" \
            --tags "reusable_workflow.file_path:${{ job.workflow_file_path }}" \
            --tags "reusable_workflow.caller_repo:${{ github.repository }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the main branch as well
        run: git fetch origin main:main

      - name: Set up Go
        uses: cloudx-io/setup-go@8b45cf394acf101459db0d47aa9735a4fe5eea63 # v1.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-key-prefix: kubernetes
          cache-dependency-path: "**/go.sum"

      - name: Kubernetes List Detected charts
        id: list
        run: go tool mage k8s:list

      - name: Kubernetes validation
        id: validate
        run: go tool mage k8s:validate

      - name: Kubernetes diff
        id: diff
        run: go tool mage k8s:diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
