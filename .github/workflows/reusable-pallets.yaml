concurrency:
  group: reusable-pallets-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs: {}
    secrets: {}

jobs:
  validate-pallet-config:
    name: Pallets config check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-dependency-path: "**/go.sum"

      - name: Pallet config validation
        id: validate
        run: go tool mage pallets:validate
