concurrency:
  group: reusable-policy-bot-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs: {}
    secrets: {}

jobs:
  validate-policy-bot-config:
    name: Policy-bot config check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6" # renovate: datasource=docker depName=docker.io/library/golang
          cache-dependency-path: "**/go.sum"

      - name: Policy-bot config validation
        id: validate
        run: go tool mage policyBotConfig:validate
