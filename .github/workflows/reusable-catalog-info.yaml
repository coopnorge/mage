concurrency:
  group: reusable-catalog-info-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs: {}
    secrets: {}

jobs:
  validate-catalog-info:
    name: Catalog info validator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-dependency-path: "**/go.sum"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liFKpdpVm7O1CJiq
          private-key: ${{ secrets.MAGE_CATALOGINFO_APP_PEM }}
          owner: coopnorge

      - name: Catalog Info Validation
        id: validate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: go tool mage catalogInfo:validate
