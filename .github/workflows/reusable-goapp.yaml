concurrency:
  group: reusable-goapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    secrets: {}
    inputs:
      oci-image-base:
        type: string
        required: true
      push-oci-image:
        type: boolean
        required: false
        default: false
      workload-identity-provider:
        type: string
        required: true
      service-account:
        type: string
      artifact-registry-location:
        type: string
        default: "europe"
        description: Artifact registry region name (e.g. "europe", "europe-north1").
      go-runtime:
        type: string
        default: "docker"
        description: Run mage go related tasks in "docker" (default) or local
      tag-based-diff:
        type: boolean
        default: true
        required: false
        description: If true it will create a github release based on the tag of the OCI
      skip-lint-and-test-on-main:
        type: boolean
        default: false
        required: false
        description: If set to true, skip the Lint and Test jobs on the main branch. Will still run on pull requests and other branches.
      datadog-site:
        type: string
        default: "datadoghq.eu"
        description: Datadog site to upload code coverage reports to.
      go-lint-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache (and golangci-lint analysis cache) for the Go Lint job.
      go-test-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache for the Go Test job.
      go-build-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache for the Go Build job.
    outputs:
      oci-images:
        value: ${{ jobs.go-build-and-push.outputs.oci-images || '{}' }}
        description: OCI image references.

jobs:
  go-app:
    name: Go App CI
    runs-on: ubuntu-24.04
    outputs:
      oci-images: ${{ steps.oci-images.outputs.images }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure access to internal and private GitHub repos
        run: git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge"
      - name: Configure access to internal and private GitHub repos
        run: git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge"
      - name: Safe Git Workspace
        run: git config --global --add safe.directory /app

        # setup stuff
      - name: Setup coop-mage
        uses: coopnorge/github-action-setup-mage@v0.0.4
        id: setup-coop-mage
      - name: Set up Go
        id: setup-go
        uses: cloudx-io/setup-go@8b45cf394acf101459db0d47aa9735a4fe5eea63 # v1.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-key-prefix: go-app
          cache-dependency-path: "**/go.sum"
      - name: Setup Golangci Lint
        id: setup-golangci
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version: v2.13.2 # renovate: datasource=docker depName=golangci/golangci-lint
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: wait for setup
        wait:
          - setup-coop-mage
          - setup-go
          - setup-golangci
          - setup-buildx
      # - name: Set up Go (cache disabled)
      #   if: ${{ !inputs.go-lint-cache-enabled }}
      #   uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      #   with:
      #     go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
      #     cache: false
      - name: Cache golangci-lint analysis cache
        if: ${{ inputs.go-lint-cache-enabled }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: "golangci-lint-v2.13.2" # renovate: datasource=docker depName=golangci/golangci-lint

      # looks like only required for multi arg buids, which we are not using
      # atm
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Go Lint
        id: go-lint
        run: "coop-mage -v go:lint"
        background: true
        env:
          GO_RUNTIME: ${{ inputs.go-runtime }}
      - name: Run Go Test
        id: go-test
        run: "coop-mage -v go:test"
        background: true
        env:
          GO_RUNTIME: ${{ inputs.go-runtime }}
      - name: Run Go Build
        id: go-build
        background: true
        run: "coop-mage -v go:buildBinaries"
      - name: Wait for lint, test and build to finish
        wait: [go-lint, go-test, go-build]

      - name: Build Docker Images
        run: "coop-mage -v docker:buildImages"
        env:
          OCI_IMAGE_BASE: ${{ inputs.oci-image-base }}
          PUSH_IMAGE: ${{ inputs.push && inputs.push-oci-image }}
          GO_RUNTIME: ${{ inputs.go-runtime }}

      - id: oci-images
        name: Output OCI images references
        run: |
          if [ -f ./var/oci-images.json ]; then
            echo "images=$(cat ./var/oci-images.json)" >> $GITHUB_OUTPUT
          else
            echo "images={}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate with GCP
        id: gcp-auth
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          create_credentials_file: true
      - name: Login to Google Cloud Artifact Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.artifact-registry-location }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Generate token for release
        id: generate_token
        if: github.ref == 'refs/heads/main'
        # v1.5.1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 172868
          private-key: ${{ secrets.WRITEBACK_APP_PRIVATE_KEY_PEM }}
          owner: coopnorge

      - name: Get tag of the build OCI
        id: oci-tag
        if: github.ref == 'refs/heads/main'
        run: |
          OCI_TAG=$(cat var/oci-images.json | yq -P | grep "tag:" | head -1 | yq '.tag')
          if [[ -z "$OCI_TAG" ]]; then
            echo cannot get an OCI TAG, bailing
            exit 1
          fi
          echo "tag=$(echo $OCI_TAG)" >> $GITHUB_OUTPUT

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        name: Create release
        id: make-release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        with:
          commitish: main
          config-name: "release-drafter.yml"
          publish: true
          version: ${{ steps.oci-tag.outputs.tag }}
          tag: ${{ steps.oci-tag.outputs.tag }}
          name: "Go OCI Release ${{ steps.oci-tag.outputs.tag }}"
          # only used when no releases exists. Initial release might be to long
          # with out limitation
          initial-commits-since: "2026-03-01T09:09:09Z"

      - name: Show output
        if: always()
        run: tree var/
        continue-on-error: true
