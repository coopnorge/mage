concurrency:
  group: reusable-goapp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    secrets: {}
    inputs:
      oci-image-base:
        type: string
        required: true
      push-oci-image:
        type: boolean
        required: false
        default: false
      workload-identity-provider:
        type: string
        required: true
      service-account:
        type: string
      artifact-registry-location:
        type: string
        default: "europe"
        description: Artifact registry region name (e.g. "europe", "europe-north1").
      go-runtime:
        type: string
        default: "docker"
        description: Run mage go related tasks in "docker" (default) or local
      tag-based-diff:
        type: boolean
        default: true
        required: false
        description: If true it will create a github release based on the tag of the OCI
      skip-lint-and-test-on-main:
        type: boolean
        default: false
        required: false
        description: If set to true, skip the Lint and Test jobs on the main branch. Will still run on pull requests and other branches.
      datadog-site:
        type: string
        default: "datadoghq.eu"
        description: Datadog site to upload code coverage reports to.
      go-lint-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache (and golangci-lint analysis cache) for the Go Lint job.
      go-test-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache for the Go Test job.
      go-build-cache-enabled:
        type: boolean
        default: true
        description: If set to false, disable the Go module/build cache for the Go Build job.
    outputs:
      oci-images:
        value: ${{ jobs.go-build-and-push.outputs.oci-images || '{}' }}
        description: OCI image references.

jobs:
  go-lint:
    name: Go Lint
    if: ${{ github.ref != 'refs/heads/main' || inputs.skip-lint-and-test-on-main == false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure access to internal and private GitHub repos
        run: git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge"
      - name: Setup coop-mage
        uses: coopnorge/github-action-setup-mage@v0.0.4
      - name: Set up Go
        if: ${{ inputs.go-lint-cache-enabled }}
        uses: cloudx-io/setup-go@8b45cf394acf101459db0d47aa9735a4fe5eea63 # v1.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-key-prefix: go-lint
          cache-dependency-path: "**/go.sum"
      - name: Set up Go (cache disabled)
        if: ${{ !inputs.go-lint-cache-enabled }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache: false
      - name: Setup Golangci Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version: v2.14.0 # renovate: datasource=docker depName=golangci/golangci-lint
      - name: Cache golangci-lint analysis cache
        if: ${{ inputs.go-lint-cache-enabled }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: "golangci-lint-v2.13.2" # renovate: datasource=docker depName=golangci/golangci-lint
      - name: Run Go Lint
        run: "coop-mage -v go:lint"
        env:
          GO_RUNTIME: ${{ inputs.go-runtime }}

  go-test:
    name: Go Test
    if: ${{ github.ref != 'refs/heads/main' || inputs.skip-lint-and-test-on-main == false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure access to internal and private GitHub repos
        run: git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge"
      - name: Setup coop-mage
        uses: coopnorge/github-action-setup-mage@v0.0.4
      - name: Set up Go
        if: ${{ inputs.go-test-cache-enabled }}
        uses: cloudx-io/setup-go@8b45cf394acf101459db0d47aa9735a4fe5eea63 # v1.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache-key-prefix: go-test
          cache-dependency-path: "**/go.sum"
      - name: Set up Go (cache disabled)
        if: ${{ !inputs.go-test-cache-enabled }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1" # renovate: datasource=docker depName=docker.io/library/golang
          cache: false
      - name: Run Go Test
        run: "coop-mage -v go:test"
        env:
          GO_RUNTIME: ${{ inputs.go-runtime }}
      - name: Upload coverage reports to Datadog
        if: ${{ steps.has-multiple-cmds.outputs.outcome == '1' }}
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: ${{ inputs.datadog-site }}
          files: ./var

  go-build:
    name: Go build
    if: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-goapp-build.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      oci-image-base: ${{ inputs.oci-image-base }}
      push: false
      go-runtime: ${{ inputs.go-runtime }}
      go-cache-enabled: ${{ inputs.go-build-cache-enabled }}

  go-build-and-push:
    name: Go build and push
    needs:
      - go-lint
      - go-test
    if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.skip-lint-and-test-on-main || (needs.go-lint.result == 'success' && needs.go-test.result == 'success')) }}
    uses: ./.github/workflows/reusable-goapp-build.yaml
    permissions:
      contents: write
      id-token: write
      packages: read
    secrets: inherit
    with:
      oci-image-base: ${{ inputs.oci-image-base }}
      push: true
      push-oci-image: ${{ inputs.push-oci-image }}
      workload-identity-provider: ${{ inputs.workload-identity-provider }}
      service-account: ${{ inputs.service-account }}
      artifact-registry-location: ${{ inputs.artifact-registry-location }}
      go-runtime: ${{ inputs.go-runtime }}
      tag-based-diff: ${{ inputs.tag-based-diff }}
      go-cache-enabled: ${{ inputs.go-build-cache-enabled }}
